name: FilePortal verification

on: [push, pull_request]

permissions:
  contents: read

jobs:
  integration:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Run release integration tests
        run: node --test tests/fileportal.test.mjs
      - name: Run FileNest browser regression
        timeout-minutes: 5
        run: node --test tests/filenest.browser.mjs
