<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Settings · FileNest</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:#020617; color:#e5e7eb; padding:20px }
    .box { max-width:720px; margin:0 auto }
    input { box-sizing:border-box; width:100%; padding:8px; margin:6px 0; border-radius:6px; border:1px solid #374151; background:#111827; color:#e5e7eb }
    input[type="checkbox"] { width:auto }
    button { background:#0ea5e9; color:#081025; padding:8px 12px; border-radius:8px; border:none; cursor:pointer; margin-right:6px }
    button:disabled { background:#6b7280; cursor:not-allowed }
    .user { display:flex; justify-content:space-between; align-items:center; padding:8px; border:1px solid #1f2937; border-radius:6px; margin-bottom:6px }
    a.back { color:#9ca3af; text-decoration:none; display:inline-block; margin-bottom:12px }
    .folder-list { background:#111827; border:1px solid #1f2937; border-radius:6px; padding:10px; margin:10px 0; max-height:200px; overflow-y:auto }
    .folder-item { padding:6px; background:#0b1220; border-radius:4px; margin:4px 0; font-size:12px; color:#9ca3af; word-break:break-all }
    .account-dialog { box-sizing:border-box; width:min(500px, calc(100% - 24px)); min-width:0; }
    .user-summary { display:grid; gap:2px; min-width:0; }
    .user-summary strong, .user-summary small { overflow-wrap:anywhere; }
    .user-summary small { color:#9ca3af; }
    @media (max-width:700px) {
      body { padding:12px }
      .user { flex-wrap:wrap; gap:6px }
      button, a.back { min-height:44px }
      input { font-size:16px }
    }
  </style>
<link rel="stylesheet" href="/filenest/site.css">
<link rel="stylesheet" href="/filenest/workspace.css">
<script src="/theme.js"></script>
<script src="/filenest/shell.js" defer></script>
</head>
<body class="fn-workspace fn-settings">
  <header id="fileNestHeader" data-page="settings"></header>
  <main class="box">
    <h1>Settings</h1>

    <p id="accountStatus" role="status"></p>
    <button id="changeOwnPassword" hidden onclick="openPwModal(currentUser)">Change my password</button>

    <div id="list" hidden></div>

    <!-- Edit User Modal -->
    <div id="editModal" role="dialog" aria-modal="true" aria-labelledby="editTitle" style="display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:rgba(2,6,23,0.6);z-index:1000">
      <div id="editDialog" class="account-dialog" tabindex="-1" style="background:#0b1220;padding:16px;border:1px solid #1f2937;border-radius:8px">
        <h3 id="editTitle" style="margin-top:0">Edit user</h3>
        <div id="editMsg" role="alert" style="color:#f97373;margin-bottom:6px"></div>
        <label for="editUsername">Username</label>
        <input id="editUsername" readonly />
        <label for="editFirstName">First name</label>
        <input id="editFirstName" autocomplete="given-name" />
        <label for="editLastName">Last name</label>
        <input id="editLastName" autocomplete="family-name" />
        <label for="editRole">Role</label>
        <input id="editRole" readonly />
        <p style="color:#9ca3af;font-size:12px">Use the row controls to change role, password, or folder access.</p>
        <div style="margin-top:8px;display:flex;gap:8px;justify-content:flex-end">
          <button type="button" onclick="submitEditUser()">Save</button>
          <button type="button" onclick="closeEditModal()" style="background:#374151;color:#e5e7eb">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Change Password Modal -->
    <div id="pwModal" role="dialog" aria-modal="true" aria-labelledby="pwTitle" style="display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:rgba(2,6,23,0.6);z-index:1000">
      <div id="pwDialog" class="account-dialog" tabindex="-1" style="background:#0b1220;padding:16px;border:1px solid #1f2937;border-radius:8px">
        <h3 id="pwTitle" style="margin-top:0">Change password for <span id="pwFor"></span></h3>
        <div id="pwMsg" role="alert" style="color:#f97373;margin-bottom:6px"></div>
        <div id="pwCurrentWrap">
          <label for="pwCurrent">Current password</label>
          <input id="pwCurrent" type="password" autocomplete="current-password" />
        </div>
        <label for="pwNew">New password</label>
        <input id="pwNew" type="password" autocomplete="new-password" />
        <label for="pwConfirm">Confirm new password</label>
        <input id="pwConfirm" type="password" autocomplete="new-password" />
        <div style="margin-top:8px;display:flex;gap:8px;justify-content:flex-end">
          <button onclick="submitChangePassword()">Save</button>
          <button onclick="closePwModal()" style="background:#374151;color:#e5e7eb">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Folder Access Modal -->
    <div id="folderModal" role="dialog" aria-modal="true" aria-labelledby="folderTitle" style="display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:rgba(2,6,23,0.6);z-index:1000;overflow-y:auto">
      <div id="folderDialog" class="account-dialog" tabindex="-1" style="background:#0b1220;padding:16px;border:1px solid #1f2937;border-radius:8px;margin:20px auto;max-height:88dvh;display:flex;flex-direction:column">
        <h3 id="folderTitle" style="margin-top:0;margin-bottom:12px">Set Folder Access for <span id="folderFor"></span></h3>
        <p style="color:#9ca3af;font-size:12px;margin-bottom:12px">Browse and select folders. Click a folder name to navigate into it.</p>
        
        <div id="folderMsg" role="alert" style="color:#f97373;margin-bottom:6px"></div>
        
        <div style="display:flex;gap:6px;margin-bottom:12px">
          <label class="fn-visually-hidden" for="browsePath">Current folder</label>
          <input id="browsePath" type="text" placeholder="Current path" readonly style="flex:1;padding:8px;border-radius:4px;border:1px solid #374151;background:#111827;color:#9ca3af;font-size:12px" />
          <button onclick="goToRoots()" style="padding:8px 12px;background:#666;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:12px">Roots</button>
        </div>

        <div id="folderBrowser" style="border:1px solid #1f2937;border-radius:4px;padding:8px;background:#111827;margin-bottom:12px;max-height:300px;overflow-y:auto;min-height:150px">
          <!-- Folders will be populated here -->
        </div>

        <h4 style="margin-top:12px;margin-bottom:8px;color:#9ca3af">Selected Folders:</h4>
        <div id="assignedFolders" style="max-height:150px;overflow-y:auto;border:1px solid #1f2937;border-radius:4px;padding:8px;background:#0b1220;margin-bottom:12px">
          <!-- Will be populated by JS -->
        </div>
        
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button onclick="submitFolderAccess()">Save</button>
          <button onclick="closeFolderModal()" style="background:#374151;color:#e5e7eb;border:none;border-radius:4px;padding:8px 12px;cursor:pointer">Cancel</button>
        </div>
      </div>
    </div>

    <section id="addUserPanel" hidden>
      <h3>Add User</h3>
      <label for="newUser">Username</label>
      <input id="newUser" autocomplete="off" />
      <label for="newFirstName">First name</label>
      <input id="newFirstName" autocomplete="given-name" />
      <label for="newLastName">Last name</label>
      <input id="newLastName" autocomplete="family-name" />
      <label for="newPass">Password</label>
      <input id="newPass" autocomplete="new-password" type="password" />
      <label style="display:block;margin:6px 0;color:#9ca3af"><input type="checkbox" id="newAdmin" /> Make admin</label>
      <button onclick="addUser()">Add</button>
      <div id="msg" role="status" style="color:#f97373;margin-top:6px"></div>
    </section>
  </main>

  <script>
    let currentUser = null;
    let currentIsAdmin = false;

    async function load() {
      const account = document.getElementById('accountStatus');
      const me = await fetch('/api/auth/me');
      if (me.status === 401) {
        window.location.replace('/login.html?next=%2Fusers.html');
        return;
      }
      if (!me.ok) {
        account.textContent = 'Failed to load your account.';
        return;
      }

      const profile = await me.json();
      currentUser = profile.user;
      currentIsAdmin = profile.isAdmin;
      account.textContent = 'Signed in as ' + currentUser;
      document.getElementById('changeOwnPassword').hidden = false;
      document.getElementById('addUserPanel').hidden = !currentIsAdmin;
      const list = document.getElementById('list');
      list.hidden = !currentIsAdmin;
      if (!currentIsAdmin) return;

      const res = await fetch('/api/users');
      if (!res.ok) { list.textContent = 'Failed to load users'; return; }
      const users = await res.json();
      list.replaceChildren();

      const adminCount = users.filter(u => u.isAdmin).length;

      users.forEach(u => {
        const div = document.createElement('div');
        div.className = 'user';
        const left = document.createElement('div');
        left.className = 'user-summary';
        const displayName = u.firstName || u.lastName ? `${u.firstName} ${u.lastName}`.trim() + ` (${u.username})` : u.username;
        const identity = document.createElement('strong');
        identity.textContent = displayName;
        const role = document.createElement('small');
        role.textContent = u.isAdmin ? 'Administrator' : 'Standard user';
        left.append(identity, role);

        const actions = document.createElement('div');
        actions.style.display = 'flex';
        actions.style.gap = '6px';
        actions.style.flexWrap = 'wrap';

        const edit = document.createElement('button');
        edit.type = 'button';
        edit.textContent = 'Edit';
        edit.dataset.editUser = u.username;
        edit.onclick = () => openEditModal(u);
        actions.appendChild(edit);

        // Promote / Demote
        if (u.isAdmin) {
          const dem = document.createElement('button');
          dem.textContent = 'Demote';
          dem.onclick = () => demoteUser(u.username);
          // prevent demote if this is current user or last admin
          if (u.username === currentUser || adminCount <= 1) dem.disabled = true;
          actions.appendChild(dem);
        } else {
          const prom = document.createElement('button');
          prom.textContent = 'Promote';
          prom.onclick = () => promoteUser(u.username);
          actions.appendChild(prom);
        }

        // Change password button
        const cp = document.createElement('button'); 
        cp.textContent = 'Password';
        cp.onclick = () => openPwModal(u.username);
        actions.appendChild(cp);

        // Manage folders button
        const folders = document.createElement('button');
        folders.textContent = 'Folders';
        folders.onclick = () => openFolderModal(u.username);
        folders.disabled = u.isAdmin;
        actions.appendChild(folders);

        // Remove
        const del = document.createElement('button'); 
        del.textContent = 'Remove';
        del.onclick = () => removeUser(u.username);
        if (u.username === currentUser) del.disabled = true; // cannot remove self
        if (u.isAdmin && adminCount <= 1) del.disabled = true; // cannot remove last admin
        actions.appendChild(del);

        div.appendChild(left);
        div.appendChild(actions);
        list.appendChild(div);
      });
    }

    async function addUser() {
      const u = document.getElementById('newUser').value.trim();
      const fn = document.getElementById('newFirstName').value.trim();
      const ln = document.getElementById('newLastName').value.trim();
      const p = document.getElementById('newPass').value;
      const isAdmin = document.getElementById('newAdmin').checked;
      const msg = document.getElementById('msg'); msg.textContent = '';
      if (!u || !p) { msg.textContent = 'username and password required'; return; }
      if (!fn || !ln) { msg.textContent = 'first name and last name required'; return; }
      const fd = new FormData(); 
      fd.append('username', u); 
      fd.append('firstName', fn);
      fd.append('lastName', ln);
      fd.append('password', p); 
      fd.append('isAdmin', isAdmin ? 'true' : 'false');
      const res = await fetch('/api/users', { method:'POST', body: fd, credentials:'include' });
      if (res.status === 201) { 
        document.getElementById('newUser').value=''; 
        document.getElementById('newFirstName').value=''; 
        document.getElementById('newLastName').value=''; 
        document.getElementById('newPass').value=''; 
        document.getElementById('newAdmin').checked=false; 
        load(); 
        return; 
      }
      const text = await res.text(); msg.textContent = text || 'Error';
    }

    async function removeUser(u) {
      if (!confirm('Remove user ' + u + '?')) return;
      const res = await fetch('/api/users/' + encodeURIComponent(u), { method:'DELETE', credentials:'include' });
      if (res.ok) load(); else {
        const txt = await res.json().catch(() => null);
        alert((txt && txt.error) || 'Failed to remove');
      }
    }

    async function promoteUser(u) {
      const res = await fetch('/api/users/' + encodeURIComponent(u) + '/promote', { method: 'POST', credentials: 'include' });
      if (res.ok) load(); else alert('Failed to promote');
    }

    async function demoteUser(u) {
      const res = await fetch('/api/users/' + encodeURIComponent(u) + '/demote', { method: 'POST', credentials: 'include' });
      if (res.ok) load(); else {
        const txt = await res.json().catch(() => null);
        alert((txt && txt.error) || 'Failed to demote');
      }
    }

    let editTarget = null;
    let editReturnFocus = null;

    function openEditModal(user) {
      editReturnFocus = document.activeElement;
      editTarget = user.username;
      document.getElementById('editMsg').textContent = '';
      document.getElementById('editUsername').value = user.username;
      document.getElementById('editFirstName').value = user.firstName || '';
      document.getElementById('editLastName').value = user.lastName || '';
      document.getElementById('editRole').value = user.isAdmin ? 'Administrator' : 'Standard user';
      document.getElementById('editModal').style.display = 'flex';
      focusWhenVisible(document.getElementById('editFirstName'));
    }

    function closeEditModal(restore = true) {
      if (document.getElementById('editModal').style.display === 'none') return;
      document.getElementById('editModal').style.display = 'none';
      editTarget = null;
      const returnFocus = editReturnFocus;
      editReturnFocus = null;
      if (restore) restoreFocus(returnFocus);
    }

    async function submitEditUser() {
      if (!editTarget) return;
      const username = editTarget;
      const firstName = document.getElementById('editFirstName').value.trim();
      const lastName = document.getElementById('editLastName').value.trim();
      const msg = document.getElementById('editMsg');
      msg.textContent = '';
      if (!firstName || !lastName) {
        msg.textContent = 'First name and last name are required.';
        return;
      }

      try {
        const res = await fetch('/api/users/' + encodeURIComponent(username), {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ firstName, lastName })
        });
        if (!res.ok) {
          const result = await res.json().catch(() => null);
          msg.textContent = result?.error || 'Failed to update user.';
          return;
        }

        closeEditModal(false);
        await load();
        document.getElementById('accountStatus').textContent = 'Updated ' + username + '.';
        [...document.querySelectorAll('[data-edit-user]')]
          .find(button => button.dataset.editUser === username)?.focus();
      } catch {
        msg.textContent = 'Request failed.';
      }
    }

    // Password change modal logic
    let pwTarget = null;
    let pwReturnFocus = null;

    function focusWhenVisible(element) {
      requestAnimationFrame(() => element?.focus());
    }

    function restoreFocus(element) {
      if (element?.isConnected) focusWhenVisible(element);
    }

    function openPwModal(username) {
      pwReturnFocus = document.activeElement;
      pwTarget = username;
      document.getElementById('pwFor').textContent = username;
      document.getElementById('pwMsg').textContent = '';
      document.getElementById('pwNew').value = '';
      document.getElementById('pwConfirm').value = '';
      document.getElementById('pwCurrent').value = '';
      document.getElementById('pwCurrentWrap').hidden = currentIsAdmin && username !== currentUser;
      document.getElementById('pwModal').style.display = 'flex';
      const firstField = document.getElementById('pwCurrentWrap').hidden
        ? document.getElementById('pwNew')
        : document.getElementById('pwCurrent');
      focusWhenVisible(firstField);
    }

    function closePwModal() {
      if (document.getElementById('pwModal').style.display === 'none') return;
      document.getElementById('pwModal').style.display = 'none';
      pwTarget = null;
      const returnFocus = pwReturnFocus;
      pwReturnFocus = null;
      restoreFocus(returnFocus);
    }

    let folderTarget = null;
    let selectedFolders = [];
    let folderReturnFocus = null;

    function openFolderModal(username) {
      folderReturnFocus = document.activeElement;
      folderTarget = username;
      selectedFolders = [];
      document.getElementById('folderFor').textContent = username;
      document.getElementById('folderMsg').textContent = '';
      
      document.getElementById('folderModal').style.display = 'flex';

      // Load current folders and show roots
      loadFoldersForUser(username);
      goToRoots();
      focusWhenVisible(document.getElementById('folderDialog'));
    }

    function closeFolderModal() {
      if (document.getElementById('folderModal').style.display === 'none') return;
      browseRequest++;
      document.getElementById('folderModal').style.display = 'none'; 
      folderTarget = null;
      selectedFolders = [];
      const returnFocus = folderReturnFocus;
      folderReturnFocus = null;
      restoreFocus(returnFocus);
    }

    async function loadFoldersForUser(username) {
      try {
        // Get currently assigned folders
        const foldersRes = await fetch('/api/users/' + encodeURIComponent(username) + '/folders', { credentials: 'include' });
        if (!foldersRes.ok) throw new Error('Failed to load folder assignments');
        const data = await foldersRes.json();
        if (folderTarget !== username) return;
        selectedFolders = data.folders || [];
        
        renderSelectedFolders();
      } catch (e) {
        document.getElementById('folderMsg').textContent = 'Failed to load folders';
      }
    }

    function goToRoots() {
      return browseFolders(null);
    }

    let browseRequest = 0;
    async function browseFolders(path) {
      const request = ++browseRequest;
      const msg = document.getElementById('folderMsg');
      const browser = document.getElementById('folderBrowser');
      msg.textContent = '';
      browser.replaceChildren();

      try {
        const url = path ? '/api/files/browse?path=' + encodeURIComponent(path) : '/api/files/roots';
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const folders = await res.json();
        if (request !== browseRequest) return;
        document.getElementById('browsePath').value = path || 'Configured roots';
        if (!folders.length) browser.textContent = path ? 'No subfolders' : 'No folders are configured';

        for (const folder of folders) {
          const row = document.createElement('div');
          row.className = 'user';
          const name = document.createElement('button');
          name.textContent = folder.name;
          name.onclick = () => browseFolders(folder.path);

          const select = document.createElement('button');
          select.textContent = 'Add';
          select.onclick = () => {
            if (!selectedFolders.includes(folder.path)) {
              selectedFolders.push(folder.path);
              renderSelectedFolders();
            }
          };

          row.append(name, select);
          browser.append(row);
        }
      } catch (error) {
        if (request === browseRequest)
          msg.textContent = 'Failed to load folders. ' + error.message;
      }
    }

    function renderSelectedFolders() {
      const assignedDiv = document.getElementById('assignedFolders');
      if (selectedFolders.length === 0) {
        assignedDiv.textContent = 'No folders selected';
        assignedDiv.style.color = '#6b7280';
      } else {
        assignedDiv.innerHTML = '';
        selectedFolders.forEach(folder => {
          const div = document.createElement('div');
          div.style.padding = '6px';
          div.style.backgroundColor = '#1f2937';
          div.style.borderRadius = '4px';
          div.style.marginBottom = '4px';
          div.style.fontSize = '12px';
          div.style.display = 'flex';
          div.style.justifyContent = 'space-between';
          div.style.alignItems = 'center';
          
          const path = document.createElement('span');
          path.textContent = folder;
          path.style.wordBreak = 'break-all';
          path.style.flex = '1';
          
          const btn = document.createElement('button');
          btn.textContent = '✕';
          btn.type = 'button';
          btn.setAttribute('aria-label', 'Remove folder ' + folder);
          btn.style.padding = '2px 6px';
          btn.style.fontSize = '10px';
          btn.style.marginLeft = '8px';
          btn.style.flexShrink = '0';
          btn.style.background = '#ef4444';
          btn.style.color = '#fff';
          btn.style.border = 'none';
          btn.style.borderRadius = '4px';
          btn.style.cursor = 'pointer';
          btn.onclick = () => {
            selectedFolders = selectedFolders.filter(f => f !== folder);
            renderSelectedFolders();
          };
          
          div.appendChild(path);
          div.appendChild(btn);
          assignedDiv.appendChild(div);
        });
      }
    }

    async function submitFolderAccess() {
      if (!folderTarget) return;
      const msg = document.getElementById('folderMsg');
      msg.textContent = '';
      
      try {
        const res = await fetch('/api/users/' + encodeURIComponent(folderTarget) + '/folders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(selectedFolders),
          credentials: 'include'
        });
        
        if (res.ok) {
          alert('Folder access updated');
          closeFolderModal();
          load();
        } else {
          const t = await res.json().catch(() => null);
          msg.textContent = (t && t.error) || 'Failed to update folder access';
        }
      } catch (e) {
        msg.textContent = 'Request failed';
      }
    }

    async function submitChangePassword() {
      const newP = document.getElementById('pwNew').value;
      const conf = document.getElementById('pwConfirm').value;
      const cur = document.getElementById('pwCurrent').value;
      const msg = document.getElementById('pwMsg'); msg.textContent = '';
      if (!pwTarget) return;
      if (!newP) { msg.textContent = 'New password required'; return; }
      if (newP !== conf) { msg.textContent = 'Passwords do not match'; return; }

      const body = new FormData();
      body.append('newPassword', newP);
      if (pwTarget === currentUser) body.append('currentPassword', cur);

      try {
        const res = await fetch('/api/users/' + encodeURIComponent(pwTarget) + '/password', { method: 'POST', body });
        if (res.ok) {
          if (pwTarget === currentUser) {
            alert('Password changed. Sign in with your new password.');
            window.location.replace('/');
            return;
          }
          document.getElementById('accountStatus').textContent = 'Password updated for ' + pwTarget;
          closePwModal();
        } else if (res.status === 403 || res.status === 401) {
          const t = await res.json().catch(() => null);
          msg.textContent = (t && t.error) || 'Not authorized';
        } else {
          const t = await res.json().catch(() => null);
          msg.textContent = (t && t.error) || 'Failed to change password';
        }
      } catch (e) { msg.textContent = 'Request failed'; }
    }

    function visibleDialog() {
      if (document.getElementById('editModal').style.display !== 'none')
        return { overlay: document.getElementById('editModal'), close: closeEditModal };
      if (document.getElementById('folderModal').style.display !== 'none')
        return { overlay: document.getElementById('folderModal'), close: closeFolderModal };
      if (document.getElementById('pwModal').style.display !== 'none')
        return { overlay: document.getElementById('pwModal'), close: closePwModal };
      return null;
    }

    document.addEventListener('keydown', event => {
      const active = visibleDialog();
      if (!active) return;
      if (event.key === 'Escape') {
        event.preventDefault();
        active.close();
        return;
      }
      if (event.key !== 'Tab') return;

      const focusable = [...active.overlay.querySelectorAll(
        'button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])'
      )].filter(element => element.getClientRects().length > 0);
      if (!focusable.length) {
        event.preventDefault();
        active.overlay.querySelector('.account-dialog')?.focus();
        return;
      }

      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      const focusIndex = focusable.indexOf(document.activeElement);
      if (event.shiftKey && focusIndex <= 0) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && (focusIndex === -1 || document.activeElement === last)) {
        event.preventDefault();
        first.focus();
      }
    });

    load().catch(() => { document.getElementById('accountStatus').textContent = 'Failed to load your account.'; });
  </script>
</body>
</html>
