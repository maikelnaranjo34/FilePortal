<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>FilePortal - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0f172a;
            color: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .card {
            background: #020617;
            border-radius: 10px;
            padding: 22px 24px;
            width: 320px;
            border: 1px solid #1f2937;
            box-shadow: 0 16px 30px rgba(0,0,0,0.6);
        }
        h1 {
            margin: 0 0 6px 0;
            font-size: 20px;
        }
        p.desc {
            margin: 0 0 16px 0;
            font-size: 13px;
            color: #9ca3af;
        }
        label {
            display: block;
            font-size: 12px;
            margin-bottom: 4px;
        }
        input[type=text],
        input[type=password] {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #1f2937;
            background: #020617;
            color: #e5e7eb;
            font-size: 13px;
            margin-bottom: 10px;
        }
        button {
            width: 100%;
            padding: 8px 10px;
            border-radius: 999px;
            border: 1px solid #2563eb;
            background: #3b82f6;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        button:hover {
            background: #2563eb;
        }
        .error {
            background: #451a1a;
            border: 1px solid #b91c1c;
            color: #fecaca;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Sign in</h1>
        <p class="desc">Use username <strong>maikel</strong> to access your portal.</p>
        <div id="errorBox" class="error">Invalid username or password.</div>
        <form method="post" action="/login">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" value="maikel" autocomplete="username" />
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" />
            <button type="submit">Login</button>
        </form>
    </div>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            if (params.get("error") === "1") {
                var box = document.getElementById("errorBox");
                if (box) box.style.display = "block";
            }
        })();
    </script>
</body>
</html>
