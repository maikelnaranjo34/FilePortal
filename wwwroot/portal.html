<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>My File Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        :root {
            color-scheme: dark;
            --bg: #020617;
            --bg-panel: #020617;
            --bg-card: #020617;
            --bg-thumb-folder: #1d4ed8;
            --bg-thumb-file: #0ea5e9;
            --border-card: #1f2937;
            --text-main: #e5e7eb;
            --text-muted: #9ca3af;
            --accent: #22c55e;
            --accent-soft: rgba(34, 197, 94, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                sans-serif;
            background: radial-gradient(circle at top left, #0f172a, #020617);
            color: var(--text-main);
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */

        .sidebar {
            width: 220px;
            background: radial-gradient(
                    circle at top left,
                    #0b1120,
                    #020617 55%,
                    #000000
                );
            border-right: 1px solid #111827;
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .logo {
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-dot {
            width: 9px;
            height: 9px;
            border-radius: 999px;
            background: radial-gradient(circle, #22c55e, #16a34a);
            box-shadow: 0 0 16px rgba(34, 197, 94, 0.8);
        }

        .user-chip {
            font-size: 12px;
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid #1e293b;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .side-section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #6b7280;
            margin: 6px 0 2px;
        }

        .side-link {
            font-size: 13px;
            padding: 6px 10px;
            border-radius: 999px;
            color: var(--text-main);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .side-link:hover {
            background: rgba(15, 23, 42, 0.85);
            border-color: #1f2937;
        }

        .side-link svg {
            width: 14px;
            height: 14px;
        }

        .side-spacer {
            flex: 1;
        }

        .logout-btn {
            margin-top: 12px;
            width: 100%;
            padding: 8px 10px;
            border-radius: 999px;
            border: 1px solid rgba(220, 38, 38, 0.4);
            background: rgba(127, 29, 29, 0.25);
            color: #fecaca;
            font-size: 13px;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: rgba(127, 29, 29, 0.45);
        }

        /* Main */

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 14px 18px;
            gap: 10px;
        }

        .main-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .title-block h1 {
            margin: 0;
            font-size: 18px;
        }

        .title-sub {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            border-radius: 999px;
            border: 1px solid #1f2937;
            background: rgba(15, 23, 42, 0.85);
            color: var(--text-main);
            font-size: 12px;
            padding: 6px 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            border-color: #374151;
            background: rgba(17, 24, 39, 0.95);
        }

        .btn-primary {
            border-color: rgba(34, 197, 94, 0.8);
            background: var(--accent-soft);
            color: #bbf7d0;
        }

        .btn-primary:hover {
            background: rgba(34, 197, 94, 0.2);
        }

        .path-bar {
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .crumb {
            cursor: pointer;
            color: #e5e7eb;
        }

        .crumb:hover {
            text-decoration: underline;
        }

        .crumb-sep {
            opacity: 0.4;
        }

        /* Grid */

        .panel {
            margin-top: 10px;
            background: radial-gradient(circle at top left, #020617, #000000);
            border-radius: 14px;
            border: 1px solid #111827;
            padding: 14px 14px 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
            flex: 1;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
        }

        .grid {
            margin-top: 6px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 10px;
            align-content: flex-start;
        }

        .card {
            position: relative;
            border-radius: 12px;
            border: 1px solid var(--border-card);
            background: linear-gradient(
                145deg,
                rgba(15, 23, 42, 0.85),
                rgba(3, 7, 18, 0.97)
            );
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
            transition: border-color 0.15s ease, transform 0.12s ease,
                box-shadow 0.15s ease, background 0.15s ease;
        }

        .card:hover {
            border-color: #374151;
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.65);
            transform: translateY(-1px);
            background: linear-gradient(
                145deg,
                rgba(15, 23, 42, 0.9),
                rgba(7, 10, 22, 0.98)
            );
        }

        .card-thumb {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: #eff6ff;
            margin-bottom: 4px;
        }

        .card-thumb.folder {
            background: linear-gradient(
                135deg,
                #1d4ed8,
                #2563eb
            );
        }

        .card-thumb.file {
            background: linear-gradient(
                135deg,
                #0ea5e9,
                #22c55e
            );
        }

        .card-name {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            font-size: 11px;
            color: var(--text-muted);
        }

        .card-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #1f2937;
            color: #9ca3af;
        }

        .empty-state {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 20px;
            text-align: center;
        }

        @media (max-width: 720px) {
            .app {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #111827;
                flex-direction: row;
                align-items: center;
                gap: 10px;
            }

            .side-spacer,
            .side-section-title {
                display: none;
            }

            .main {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div>
            <div class="logo">
                <span class="logo-dot"></span>
                <span>My File Portal</span>
            </div>
            <div class="user-chip">
                Logged in as <span id="userName">maikel</span>
            </div>
        </div>

        <div>
            <div class="side-section-title">Navigation</div>
            <div class="side-link" id="nav-roots">
                <span>📂</span>
                <span>Roots</span>
            </div>
            <div class="side-link" id="nav-refresh">
                <span>🔄</span>
                <span>Refresh</span>
            </div>
        </div>

        <div class="side-spacer"></div>

        <button class="logout-btn" id="btnLogout">
            Log out
        </button>
    </aside>

    <main class="main">
        <div class="main-header">
            <div class="title-block">
                <h1>My files</h1>
                <div class="title-sub" id="subtitle">
                    Browse your drives and folders.
                </div>
            </div>
            <div class="toolbar">
                <button class="btn" id="btnUp">⬆ Up</button>
            </div>
        </div>

        <div class="path-bar" id="pathBar">
            <span class="crumb" id="crumbRoots">Roots</span>
        </div>

        <section class="panel">
            <div class="panel-header">
                <span id="panelTitle">Folders</span>
                <span id="panelInfo"></span>
            </div>
            <div class="grid" id="grid"></div>
            <div class="empty-state" id="emptyState" style="display:none;">
                This folder is empty.
            </div>
        </section>
    </main>
</div>

<script>
    // ======== STATE ========
    let currentRoot = null;      // e.g. "DiskE"
    let currentSubpath = "";     // e.g. "Folder1/Folder2"
    let isShowingRoots = true;

    const gridEl = document.getElementById("grid");
    const emptyEl = document.getElementById("emptyState");
    const panelTitleEl = document.getElementById("panelTitle");
    const panelInfoEl = document.getElementById("panelInfo");
    const pathBarEl = document.getElementById("pathBar");
    const subtitleEl = document.getElementById("subtitle");

    // ======== HELPERS ========

    function fmtBytes(bytes) {
        if (bytes == null) return "";
        const sizes = ["B", "KB", "MB", "GB", "TB"];
        if (bytes === 0) return "0 B";
        const i = Math.floor(Math.log(bytes) / Math.log(1024));
        return (bytes / Math.pow(1024, i)).toFixed(1) + " " + sizes[i];
    }

    function fmtDate(dateString) {
        if (!dateString) return "";
        const d = new Date(dateString);
        if (isNaN(d.getTime())) return "";
        return d.toLocaleString();
    }

    function buildDownloadUrl(root, subpath) {
        const params = new URLSearchParams();
        params.set("root", root || "");
        params.set("subpath", subpath || "");
        return "/api/files/download?" + params.toString();
    }

    function buildFilesUrl(root, subpath) {
        const params = new URLSearchParams();
        params.set("root", root || "");
        params.set("subpath", subpath || "");
        return "/api/files?" + params.toString();
    }

    function clearGrid() {
        gridEl.innerHTML = "";
    }

    function setEmptyVisible(visible) {
        emptyEl.style.display = visible ? "block" : "none";
    }

    // ======== PATH / BREADCRUMBS ========

    function renderPathBar() {
        pathBarEl.innerHTML = "";

        const rootCrumb = document.createElement("span");
        rootCrumb.className = "crumb";
        rootCrumb.textContent = "Roots";
        rootCrumb.onclick = () => showRoots();
        pathBarEl.appendChild(rootCrumb);

        if (isShowingRoots || !currentRoot) {
            return;
        }

        // " / DiskE"
        const sep1 = document.createElement("span");
        sep1.className = "crumb-sep";
        sep1.textContent = " / ";
        pathBarEl.appendChild(sep1);

        const rootCrumb2 = document.createElement("span");
        rootCrumb2.className = "crumb";
        rootCrumb2.textContent = currentRoot;
        rootCrumb2.onclick = () => openRoot(currentRoot);
        pathBarEl.appendChild(rootCrumb2);

        if (!currentSubpath) return;

        const parts = currentSubpath.split("/").filter(Boolean);
        let pathSoFar = "";
        parts.forEach((part, index) => {
            const sep = document.createElement("span");
            sep.className = "crumb-sep";
            sep.textContent = " / ";
            pathBarEl.appendChild(sep);

            pathSoFar += (pathSoFar ? "/" : "") + part;
            const c = document.createElement("span");
            c.className = "crumb";
            c.textContent = part;
            if (index < parts.length - 1) {
                const pathForClick = pathSoFar;
                c.onclick = () => openFolder(pathForClick);
            }
            pathBarEl.appendChild(c);
        });
    }

    function goUp() {
        if (isShowingRoots || !currentRoot) {
            showRoots();
            return;
        }

        if (!currentSubpath) {
            // go back to roots
            showRoots();
            return;
        }

        const parts = currentSubpath.split("/").filter(Boolean);
        parts.pop();
        currentSubpath = parts.join("/");
        loadFolder();
    }

    // ======== ROOTS ========

    async function showRoots() {
        isShowingRoots = true;
        currentRoot = null;
        currentSubpath = "";
        panelTitleEl.textContent = "Roots";
        subtitleEl.textContent = "Browse your drives and folders.";
        renderPathBar();
        clearGrid();
        setEmptyVisible(false);

        try {
            const res = await fetch("/api/files/roots");
            if (!res.ok) throw new Error("Failed to load roots");
            /** @type {string[]} */
            const roots = await res.json();

            if (!roots || roots.length === 0) {
                setEmptyVisible(true);
                panelInfoEl.textContent = "";
                return;
            }

            panelInfoEl.textContent = `${roots.length} root(s)`;
            setEmptyVisible(false);

            roots.forEach(rootName => {
                const card = document.createElement("div");
                card.className = "card";
                card.onclick = () => openRoot(rootName);

                const thumb = document.createElement("div");
                thumb.className = "card-thumb folder";
                thumb.textContent = "📁";

                const name = document.createElement("div");
                name.className = "card-name";
                name.textContent = rootName;

                const meta = document.createElement("div");
                meta.className = "card-meta";
                meta.textContent = "Drive root";

                const badge = document.createElement("div");
                badge.className = "card-badge";
                badge.textContent = "ROOT";

                card.appendChild(thumb);
                card.appendChild(name);
                card.appendChild(meta);
                card.appendChild(badge);

                gridEl.appendChild(card);
            });
        } catch (err) {
            console.error(err);
            setEmptyVisible(true);
            emptyEl.textContent = "Error loading roots.";
            panelInfoEl.textContent = "";
        }
    }

    function openRoot(rootName) {
        currentRoot = rootName;
        currentSubpath = "";
        isShowingRoots = false;
        loadFolder();
    }

    // ======== FILES / FOLDERS ========

    function openFolder(subpath) {
        currentSubpath = subpath || "";
        isShowingRoots = false;
        loadFolder();
    }

    async function loadFolder() {
        if (!currentRoot) {
            showRoots();
            return;
        }

        subtitleEl.textContent = `Browsing ${currentRoot}${currentSubpath ? "/" + currentSubpath : ""}`;
        panelTitleEl.textContent = "Folders & files";
        renderPathBar();
        clearGrid();
        setEmptyVisible(false);
        emptyEl.textContent = "This folder is empty.";

        try {
            const url = buildFilesUrl(currentRoot, currentSubpath);
            const res = await fetch(url);
            if (!res.ok) throw new Error("Failed to load folder");
            /** @type {{name:string,isDirectory:boolean,sizeBytes:number|null,lastModified:string|null}[]} */
            const items = await res.json();

            if (!items || items.length === 0) {
                setEmptyVisible(true);
                panelInfoEl.textContent = "";
                return;
            }

            panelInfoEl.textContent = `${items.length} item(s)`;
            setEmptyVisible(false);

            // Folders first, then files
            items.sort((a, b) => {
                if (a.isDirectory && !b.isDirectory) return -1;
                if (!a.isDirectory && b.isDirectory) return 1;
                return a.name.localeCompare(b.name);
            });

            items.forEach(item => {
                const card = document.createElement("div");
                card.className = "card";

                const thumb = document.createElement("div");
                thumb.className = "card-thumb " + (item.isDirectory ? "folder" : "file");
                thumb.textContent = item.isDirectory ? "📁" : "📄";

                const name = document.createElement("div");
                name.className = "card-name";
                name.textContent = item.name;

                const meta = document.createElement("div");
                meta.className = "card-meta";
                const parts = [];
                if (item.isDirectory) {
                    parts.push("Folder");
                } else if (item.sizeBytes != null) {
                    parts.push(fmtBytes(item.sizeBytes));
                }
                const d = fmtDate(item.lastModified);
                if (d) parts.push(d);
                meta.textContent = parts.join(" • ");

                const badge = document.createElement("div");
                badge.className = "card-badge";
                badge.textContent = item.isDirectory ? "DIR" : "FILE";

                card.appendChild(thumb);
                card.appendChild(name);
                card.appendChild(meta);
                card.appendChild(badge);

                if (item.isDirectory) {
                    card.ondblclick = () => {
                        const newPath = currentSubpath
                            ? currentSubpath + "/" + item.name
                            : item.name;
                        openFolder(newPath);
                    };
                } else {
                    card.ondblclick = () => {
                        const filePath = currentSubpath
                            ? currentSubpath + "/" + item.name
                            : item.name;
                        const url = buildDownloadUrl(currentRoot, filePath);
                        window.location.href = url;
                    };
                }

                gridEl.appendChild(card);
            });
        } catch (err) {
            console.error(err);
            setEmptyVisible(true);
            emptyEl.textContent = "Error loading folder.";
            panelInfoEl.textContent = "";
        }
    }

    // ======== EVENTS ========

    document.getElementById("btnUp").addEventListener("click", goUp);
    document.getElementById("nav-roots").addEventListener("click", showRoots);
    document.getElementById("nav-refresh").addEventListener("click", () => {
        if (isShowingRoots) showRoots();
        else loadFolder();
    });

    // You can wire this to your logout endpoint if you have one.
    document.getElementById("btnLogout").addEventListener("click", () => {
        // Example: window.location.href = "/logout";
        alert("Logout button clicked (wire this to your logout endpoint).");
    });

    // ======== INITIAL LOAD ========

    showRoots();
</script>
</body>
</html>
