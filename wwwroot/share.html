<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Shared photos</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="/theme.js"></script>
<script src="/preview.js"></script>
<style>
:root{--bg:#0b0f17;--panel:#11161f;--line:#1f2733;--text:#e7eaf0;--muted:#9aa4b2;--accent:#6366f1}
html[data-theme="light"]{--bg:#f4f6fb;--panel:#eef1f7;--line:#dde2ec;--text:#1a2230;--muted:#5b6677;--accent:#6366f1}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.top{display:flex;align-items:center;gap:10px;padding:16px 22px;border-bottom:1px solid var(--line)}
.top .dot{width:26px;height:26px;border-radius:50%;background:conic-gradient(#ef4444,#f59e0b,#10b981,#3b82f6,#a855f7,#ef4444)}
.top h1{font-size:18px;margin:0;font-weight:600}
.wrap{padding:22px;max-width:1200px;margin:0 auto}
h2{margin:0 0 4px}.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.tile{aspect-ratio:1/1;border-radius:8px;overflow:hidden;background:var(--panel);cursor:pointer;position:relative}
.tile img{width:100%;height:100%;object-fit:cover}
.tile .vb{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);border-radius:4px;padding:1px 6px;font-size:11px}
.empty{color:var(--muted);text-align:center;padding:60px 0}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;flex-direction:column;z-index:30}
.lb.show{display:flex}
.preview-tools{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;padding:8px}
.preview-tools button{min-height:44px;min-width:44px;border:0;border-radius:999px;background:var(--panel);color:var(--text);padding:6px 12px;cursor:pointer}
.stage{position:relative;flex:1;min-height:0}
#media{display:grid;place-items:center;container-type:size;height:100%;width:100%;overflow:hidden}
.lb img,.lb video{max-width:100%;max-height:100%;max-width:100cqw;max-height:100cqh;object-fit:contain}
#media.quarter-turn img,#media.quarter-turn video{max-width:100cqh;max-height:100cqw}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);border:none;color:#fff;width:46px;height:46px;border-radius:50%;font-size:22px;cursor:pointer}
.lb .p{left:18px}.lb .n{right:18px}
@media(max-width:700px){.wrap{padding:10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.lb .p{left:6px}.lb .n{right:6px}}
</style>
</head>
<body>
<div class="top"><div class="dot"></div><h1>Photos</h1></div>
<div class="wrap" id="wrap"><div class="empty">Loading…</div></div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Shared media preview">
  <div class="preview-tools">
    <button id="rotateLeft" aria-label="Rotate counterclockwise">↶</button>
    <button id="rotateRight" aria-label="Rotate clockwise">↷</button>
    <button id="dl">Download</button>
    <button id="x">Close</button>
  </div>
  <div class="stage">
    <div id="media"></div>
    <button class="nav p" id="p" aria-label="Previous item">‹</button>
    <button class="nav n" id="n" aria-label="Next item">›</button>
  </div>
</div>

<script>
const token = new URLSearchParams(location.search).get("token");
const wrap = document.getElementById("wrap");
let photos = [], idx = -1, type = "photo";

function tUrl(id){ return `/api/sharing/public/${encodeURIComponent(token)}/photo/${encodeURIComponent(id)}/thumbnail`; }
function fUrl(id){ return `/api/sharing/public/${encodeURIComponent(token)}/photo/${encodeURIComponent(id)}/file`; }

(async () => {
  if (!token) { wrap.innerHTML = '<div class="empty">Invalid share link.</div>'; return; }
  try {
    const r = await fetch("/api/sharing/public/" + encodeURIComponent(token));
    if (!r.ok) { wrap.innerHTML = '<div class="empty">This share link is invalid or has expired.</div>'; return; }
    const d = await r.json();
    type = d.type; photos = d.photos || [];
    wrap.innerHTML = "";
    wrap.appendChild(Object.assign(document.createElement("h2"),{textContent:d.title||"Shared"}));
    const sub = document.createElement("div"); sub.className="sub";
    sub.textContent = (d.description? d.description+" · " : "") + photos.length + " item(s)";
    wrap.appendChild(sub);
    if (!photos.length){ wrap.appendChild(Object.assign(document.createElement("div"),{className:"empty",textContent:"Nothing to show."})); return; }
    const grid = document.createElement("div"); grid.className="grid";
    photos.forEach((p,i)=>{
      const t=document.createElement("div"); t.className="tile";
      const im=document.createElement("img"); im.loading="lazy"; im.src=tUrl(p.id); t.appendChild(im);
      if(p.isVideo){const b=document.createElement("div");b.className="vb";b.textContent="▶ video";t.appendChild(b);}
      t.onclick=()=>open(i); grid.appendChild(t);
    });
    wrap.appendChild(grid);
  } catch { wrap.innerHTML = '<div class="empty">Error loading share.</div>'; }
})();

const lb=document.getElementById("lb"), media=document.getElementById("media");
function open(i){ idx=i; show(); lb.classList.add("show"); }
function show(){
  const p=photos[idx]; media.replaceChildren(); media.classList.remove("quarter-turn");
  if(p.isVideo){const v=document.createElement("video");v.src=fUrl(p.id);v.controls=true;v.autoplay=true;v.playsInline=true;media.appendChild(v);}
  else{const im=document.createElement("img");im.src=fUrl(p.id);media.appendChild(im);}
}
function nav(d){ idx=(idx+d+photos.length)%photos.length; show(); }
function close(){lb.classList.remove("show");media.replaceChildren();}
document.getElementById("x").onclick=close;
document.getElementById("rotateLeft").onclick=()=>previewRotation.turn(media.firstElementChild,-90);
document.getElementById("rotateRight").onclick=()=>previewRotation.turn(media.firstElementChild,90);
document.getElementById("p").onclick=()=>nav(-1);
document.getElementById("n").onclick=()=>nav(1);
document.getElementById("dl").onclick=()=>{const p=photos[idx];const a=document.createElement("a");a.href=fUrl(p.id);a.download=p.fileName;a.click();};
document.addEventListener("keydown",e=>{ if(!lb.classList.contains("show"))return;
  if(e.key==="Escape")close(); else if(e.key==="ArrowLeft")nav(-1); else if(e.key==="ArrowRight")nav(1); });
</script>
</body>
</html>
