<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Photos</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="/theme.js"></script>
<style>
:root{
  --bg:#0b0f17; --panel:#11161f; --panel2:#0d1219; --line:#1f2733; --text:#e7eaf0;
  --muted:#9aa4b2; --accent:#6366f1; --accent2:#8b5cf6; --danger:#ef4444; --star:#fbbf24;
  --navactive-bg:rgba(99,102,241,.16); --navactive-text:#c7d2fe; --toast-bg:#1f2937;
}
html[data-theme="light"]{
  --bg:#f4f6fb; --panel:#ffffff; --panel2:#eef1f7; --line:#dde2ec; --text:#1a2230;
  --muted:#5b6677; --accent:#6366f1; --accent2:#8b5cf6; --danger:#ef4444; --star:#f59e0b;
  --navactive-bg:rgba(99,102,241,.12); --navactive-text:#4f46e5; --toast-bg:#1f2937;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button{font-family:inherit}
a{color:inherit;text-decoration:none}

/* Layout */
.app{display:grid;grid-template-rows:60px 1fr;height:100vh}
.topbar{display:flex;align-items:center;gap:16px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px;min-width:160px}
.brand .dot{width:28px;height:28px;border-radius:50%;background:conic-gradient(#ef4444,#f59e0b,#10b981,#3b82f6,#a855f7,#ef4444)}
.search{flex:1;max-width:640px;position:relative}
.search input{width:100%;padding:10px 14px 10px 38px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:14px;outline:none}
.search input:focus{border-color:var(--accent)}
.search .icon{position:absolute;left:13px;top:9px;color:var(--muted)}
.topbar .spacer{flex:1}
.iconbtn{background:transparent;border:1px solid transparent;color:var(--text);width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:16px}
.iconbtn:hover{background:var(--panel2)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:600;cursor:pointer}

.body{display:grid;grid-template-columns:220px 1fr;min-height:0}
.nav{border-right:1px solid var(--line);background:var(--panel);padding:14px 10px;display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:999px;color:var(--muted);cursor:pointer;font-size:14px}
.nav a:hover{background:var(--panel2);color:var(--text)}
.nav a.active{background:var(--navactive-bg);color:var(--navactive-text)}
.nav .sep{height:1px;background:var(--line);margin:10px 6px}
.main{min-height:0;overflow-y:auto;position:relative;padding:18px 22px 60px}

.viewhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.viewhead h2{margin:0;font-size:22px;font-weight:600}
.viewhead .sub{color:var(--muted);font-size:13px;margin-top:2px}

/* Timeline */
.section{margin-bottom:26px}
.section h3{font-size:15px;font-weight:600;margin:0 0 10px;color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.tile{position:relative;aspect-ratio:1/1;background:var(--panel2);border-radius:8px;overflow:hidden;cursor:pointer}
.tile img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .3s}
.tile img.loaded{opacity:1}
.tile .vbadge{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);border-radius:4px;padding:1px 6px;font-size:11px}
.tile .star{position:absolute;right:8px;bottom:8px;color:var(--star);font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.7);display:none}
.tile.fav .star{display:block}
.tile .check{position:absolute;left:8px;top:8px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;font-size:13px}
.tile:hover .check{display:flex}
.tile.selected .check{display:flex;background:var(--accent);border-color:var(--accent)}
.tile.selected{outline:3px solid var(--accent);outline-offset:-3px}
.tile.selected img{transform:scale(.86);transition:transform .12s}

/* Albums */
.albumgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.albumcard{cursor:pointer}
.albumcard .cover{aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--panel2);display:flex;align-items:center;justify-content:center}
.albumcard .cover img{width:100%;height:100%;object-fit:cover}
.albumcard .nm{margin-top:8px;font-weight:600;font-size:14px}
.albumcard .ct{color:var(--muted);font-size:12px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent)}
.btn.primary:hover{background:#4f46e5}
.btn.danger{background:var(--danger);border-color:var(--danger)}

/* Empty / loading */
.empty{color:var(--muted);text-align:center;padding:60px 0;font-size:14px}
.spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* Selection bar */
.selbar{position:sticky;top:-18px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:10px 14px;display:none;align-items:center;gap:10px;margin-bottom:14px}
.selbar.show{display:flex}
.selbar .cnt{font-weight:600;margin-right:auto}

/* Search filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:end}
.filters .f{display:flex;flex-direction:column;gap:4px}
.filters label{font-size:11px;color:var(--muted)}
.filters input,.filters select{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:13px}

/* Lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:50;display:none;flex-direction:column}
.lb.show{display:flex}
.lb .lbtop{display:flex;align-items:center;gap:8px;padding:12px 16px;color:#fff}
.lb .lbtop .ttl{font-size:14px;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .lbtop .spacer{flex:1}
.lb .stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
.lb .stage img,.lb .stage video{max-width:92vw;max-height:82vh;object-fit:contain}
.lb .navbtn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.1);border:none;color:#fff;
  width:48px;height:48px;border-radius:50%;font-size:22px;cursor:pointer}
.lb .navbtn:hover{background:rgba(255,255,255,.22)}
.lb .prev{left:18px}.lb .next{right:18px}
.lb .info{position:absolute;right:0;top:0;bottom:0;width:330px;background:var(--panel);border-left:1px solid var(--line);
  padding:18px;overflow-y:auto;transform:translateX(100%);transition:transform .25s}
.lb .info.show{transform:translateX(0)}
.lb .info h4{margin:0 0 14px;font-size:16px}
.lb .info .row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.lb .info .row .k{color:var(--muted);min-width:96px}
.lb .info .row .v{flex:1;word-break:break-word}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:none;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;width:420px;max-width:92vw}
.modal h3{margin:0 0 14px}
.modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}
.modal input,.modal textarea,.modal select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:14px}
.modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.modal .albumlist{max-height:240px;overflow-y:auto;margin-top:8px}
.modal .albumlist .it{display:flex;align-items:center;gap:10px;padding:9px;border-radius:8px;cursor:pointer}
.modal .albumlist .it:hover{background:var(--panel2)}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--toast-bg);border:1px solid var(--line);
  color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;z-index:80;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><div class="dot"></div><span>Photos</span></div>
    <div class="search">
      <span class="icon">🔍</span>
      <input id="globalSearch" placeholder="Search by name, camera, folder…" />
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="scanBtn" title="Rescan library" style="display:none">🔄</button>
    <a class="iconbtn" href="/files.html" title="File manager">🗂️</a>
    <div class="avatar" id="avatar" title="Account">U</div>
  </div>

  <div class="body">
    <nav class="nav">
      <a href="#photos" data-view="photos" class="active"><span>🖼️</span> Photos</a>
      <a href="#albums" data-view="albums"><span>📚</span> Albums</a>
      <a href="#favorites" data-view="favorites"><span>⭐</span> Favorites</a>
      <a href="#search" data-view="search"><span>🔎</span> Search</a>
      <div class="sep"></div>
      <a href="/files.html"><span>🗂️</span> File manager</a>
      <a href="/users.html" id="navUsers" style="display:none"><span>👥</span> Manage users</a>
      <div class="sep"></div>
      <a href="/login.html" id="navLogout"><span>🚪</span> Sign out</a>
    </nav>

    <main class="main" id="main">
      <!-- views injected here -->
    </main>
  </div>
</div>

<!-- Lightbox -->
<div class="lb" id="lightbox">
  <div class="lbtop">
    <button class="iconbtn" id="lbClose">✕</button>
    <span class="ttl" id="lbTitle"></span>
    <span class="spacer"></span>
    <button class="iconbtn" id="lbFav" title="Favorite">☆</button>
    <button class="iconbtn" id="lbSlideshow" title="Slideshow">▶️</button>
    <button class="iconbtn" id="lbShare" title="Share">🔗</button>
    <button class="iconbtn" id="lbDownload" title="Download">⬇️</button>
    <button class="iconbtn" id="lbFull" title="Fullscreen">⛶</button>
    <button class="iconbtn" id="lbInfoBtn" title="Info">ℹ️</button>
  </div>
  <div class="stage" id="lbStage">
    <button class="navbtn prev" id="lbPrev">‹</button>
    <div id="lbMedia"></div>
    <button class="navbtn next" id="lbNext">›</button>
    <div class="info" id="lbInfo">
      <h4>Details</h4>
      <div id="lbInfoBody"></div>
    </div>
  </div>
</div>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<iframe id="galleryDownload" name="galleryDownload" title="Photo archive download" hidden></iframe>
<script src="/app.js?v=gallery"></script>
</body>
</html>
